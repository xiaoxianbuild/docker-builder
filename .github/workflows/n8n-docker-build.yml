name: Build and Push n8n Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'n8n/**'
      - '.github/workflows/n8n-docker-build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/n8n

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get latest n8n version
        id: get_version
        run: |
          chmod +x n8n/get_version.sh
          LATEST_VERSION=$(./n8n/get_version.sh n8n)
          CHINESE_VERSION=$(./n8n/get_version.sh chinese "$LATEST_VERSION")
          echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "chinese_version=$CHINESE_VERSION" >> $GITHUB_OUTPUT
          echo "Latest n8n version found: $LATEST_VERSION"
          echo "Latest chinese version found: $CHINESE_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./n8n
          push: true
          platforms: ${{ matrix.platform }}
          build-args: |
            N8N_VERSION=${{ steps.get_version.outputs.version }}
            CHINESE_VERSION=${{ steps.get_version.outputs.chinese_version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.version }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get latest n8n version
        id: get_version
        run: |
          chmod +x n8n/get_version.sh
          LATEST_VERSION=$(./n8n/get_version.sh n8n)
          echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          
          docker buildx imagetools create -t ${IMAGE}:${VERSION} -t ${IMAGE}:latest \
            ${IMAGE}:${VERSION}-amd64 \
            ${IMAGE}:${VERSION}-arm64
